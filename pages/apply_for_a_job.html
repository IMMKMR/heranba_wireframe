<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for a Job - Heranba Wireframe</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="wireframe-container">
        <header><div class="logo-box">HERANBA</div><nav><a href="home.html">Home</a><a href="products.html">Products</a><a href="contact.html">Contact</a></nav></header>
        <div class="hero" style="min-height: 150px; background: #fff; border-bottom: 2px solid #000; padding: 40px;"><h1 style="font-size: 40px;">Apply for a Job</h1></div>
        
        <div class="section">
            <div class="section-header"><h2 class="section-title">Application Form</h2></div>
            <div style="display: flex; gap: 40px;">
                <div style="flex: 2; border: 1px solid #000; padding: 40px; background: #fff;">
                    <div style="height: 30px; border: 1px solid #000; margin-bottom: 15px; background: #f0f0f0;"></div>
                    <div style="height: 30px; border: 1px solid #000; margin-bottom: 15px; background: #f0f0f0;"></div>
                    <div style="height: 100px; border: 1px solid #000; margin-bottom: 15px; background: #f0f0f0;"></div>
                    <div style="width: 150px; height: 40px; background: #000;"></div>
                </div>
                <div style="flex: 1; border: 1px solid #000; background: #e0e0e0;"></div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-header"><h2 class="section-title">Upload Resume</h2></div>
            <div class="grid">
                <div class="card"><div class="card-img"></div><div class="card-title">Upload Resume Item 1</div></div>
                <div class="card"><div class="card-img"></div><div class="card-title">Upload Resume Item 2</div></div>
                <div class="card"><div class="card-img"></div><div class="card-title">Upload Resume Item 3</div></div>
            </div>
        </div>
        
        <footer><div class="footer-col"><div class="logo-box" style="background:#fff;">HERANBA</div></div><div class="footer-col"><h4>Navigation</h4></div><div class="footer-col"><h4>Contact</h4></div></footer>
    </div>
